[package]
name = "nexa-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "macros", "migrate", "rust_decimal", "json"] }
rust_decimal = { version = "1", features = ["maths", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "set-header"] }
sha2 = "0.10"
hmac = "0.12"
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = { version = "0.10", default-features = false, features = ["std", "quanta"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
